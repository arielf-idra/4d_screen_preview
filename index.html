<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send to Screen</title>
<!--
  Sends a 320x240 PNG to the TheraDrain 4D display (gen4-uLCD-32DCT-CLB running
  Diablo16 SPE at 115200 baud) over its USB adaptor, using Chrome's Web Serial.

  Protocol (DIABLO-16 Serial SPE Command Set rev 2.4), each command answered
  before the next is sent:
    Get Display Model  00 1A                    -> 06, u16 count, name
    Screen Mode        FF 42 00 00 (landscape)  -> 06, u16 previous mode
    Clear Screen       FF 82                    -> 06
    Blit Com to Display 00 23 x y w h + RGB565 big-endian pixels -> 06
  Pixels are sent 8 rows per blit. Verified on the real screen 2026-10-14
  (RGB565 MSB first, no red/blue swap, ~13.5 s per frame).
-->
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #d9d9dc; --accent: #2457d6; --accent-text: #ffffff;
    --ok: #1d7a3a; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --card: #222225; --text: #f2f2f4; --muted: #a0a0a8;
      --line: #3a3a3f; --accent: #5b8cff; --accent-text: #0d0d10;
      --ok: #5fd07f; --bad: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  #drop {
    background: var(--card); border: 2px dashed var(--line); border-radius: 14px;
    min-height: 300px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; cursor: pointer; text-align: center;
  }
  #drop.over { border-color: var(--accent); }
  #drop .big { font-size: 20px; font-weight: 600; }
  #drop .hint { color: var(--muted); font-size: 14px; }
  canvas {
    width: 100%; max-width: 640px; aspect-ratio: 4 / 3; image-rendering: pixelated;
    border-radius: 6px; display: none; background: #000;
  }
  #send {
    margin-top: 20px; width: 100%; font-size: 20px; font-weight: 600; padding: 16px;
    border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-text);
    cursor: pointer;
  }
  #send:disabled { opacity: .4; cursor: default; }
  progress { width: 100%; height: 10px; margin-top: 16px; display: none; }
  #status { margin-top: 14px; min-height: 1.5em; font-size: 17px; }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
  #debug { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  #copyReport {
    background: none; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
    color: var(--text); font: inherit; cursor: pointer;
  }
  #copied { margin-left: 10px; }
  #reportBox {
    display: block; width: 100%; height: 220px; margin-top: 12px; padding: 8px;
    background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
  }
  #reportBox[hidden] { display: none; }
  #details { margin-top: 6px; color: var(--muted); font-size: 13px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #nochrome {
    display: none; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; margin-bottom: 20px; color: var(--bad);
  }
</style>
</head>
<body>
<main>
  <h1>Send to Screen</h1>
  <p class="sub">Drop a 320 × 240 PNG, then click Send. The screen updates in about 20 seconds.</p>

  <div id="nochrome">This page needs <b>Google Chrome</b> (or Microsoft Edge). Open it in Chrome and try again.</div>

  <div id="drop" tabindex="0">
    <canvas id="preview" width="320" height="240"></canvas>
    <div class="big" id="dropText">Drop your PNG here</div>
    <div class="hint" id="dropHint">or click to choose a file</div>
  </div>
  <input type="file" id="file" accept="image/png" hidden>

  <button id="send" disabled>Send to screen</button>
  <progress id="bar" max="240" value="0"></progress>
  <div id="status"></div>
  <div id="details"></div>

  <div id="debug">
    <button id="copyReport" type="button">Copy troubleshooting report</button>
    <span id="copied"></span>
    <textarea id="reportBox" readonly hidden></textarea>
  </div>
</main>

<script>
"use strict";
const W = 320, H = 240, ROWS = 8, BAUD = 115200;
const BOOT_MS = 3500;           // screen start-up time after the port opens
const SILABS_VENDOR = 0x10c4;   // the screen's USB adaptor (CP2102)

const $ = id => document.getElementById(id);
const drop = $("drop"), fileInput = $("file"), sendBtn = $("send");
const bar = $("bar"), statusEl = $("status"), preview = $("preview");

const VERSION = "2026-10-14.4";

let pixels = null;   // Uint8Array, W*H*2 bytes, RGB565 big-endian
let busy = false;

// ---------- troubleshooting log ----------
// Everything that happens is logged here (in memory only; nothing leaves the
// page). "Copy troubleshooting report" puts it on the clipboard so the
// designer can paste it into a message.

const debugLog = [];
const t0page = performance.now();
function dbg(msg) {
  const t = ((performance.now() - t0page) / 1000).toFixed(3).padStart(8);
  debugLog.push(`${t}s  ${msg}`);
  if (debugLog.length > 2000) debugLog.splice(0, debugLog.length - 2000);
}
const errText = e => e ? `${e.name || "Error"}: ${e.message || e}` : "unknown error";

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = kind || "";
  dbg(`status: ${text}`);
}

async function buildReport() {
  const lines = [
    "Send to Screen - troubleshooting report",
    `page version: ${VERSION}`,
    `time: ${new Date().toISOString()}`,
    `url: ${location.href}`,
    `browser: ${navigator.userAgent}`,
    `platform: ${(navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform}`,
    `web serial: ${"serial" in navigator ? "yes" : "NO"}`,
  ];
  if ("serial" in navigator) {
    try {
      const ports = await navigator.serial.getPorts();
      lines.push(`allowed ports: ${ports.length ? ports.map(p => JSON.stringify(p.getInfo())).join(", ") : "none"}`);
    } catch (e) { lines.push(`allowed ports: ${errText(e)}`); }
  }
  lines.push(`status shown: ${statusEl.textContent || "-"}`);
  if ($("details").textContent) lines.push($("details").textContent);
  lines.push("", "log:", ...debugLog);
  return lines.join("\n");
}

$("copyReport").addEventListener("click", async () => {
  const report = await buildReport();
  const box = $("reportBox");
  box.value = report;
  try {
    await navigator.clipboard.writeText(report);
    $("copied").textContent = "Copied. Paste it into a message to Ariel.";
    box.hidden = true;
  } catch {
    // Clipboard blocked: show the text so it can be copied by hand.
    $("copied").textContent = "Select all the text below, copy it, and paste it into a message to Ariel.";
    box.hidden = false;
    box.select();
  }
});

window.addEventListener("error", e => dbg(`page error: ${e.message} (${e.filename}:${e.lineno})`));
window.addEventListener("unhandledrejection", e => dbg(`unhandled: ${errText(e.reason)}`));

dbg(`page loaded, version ${VERSION}`);
if (!("serial" in navigator)) {
  $("nochrome").style.display = "block";
  dbg("web serial not available in this browser");
} else {
  navigator.serial.addEventListener("connect", e => dbg(`usb device connected: ${JSON.stringify(e.target.getInfo())}`));
  navigator.serial.addEventListener("disconnect", e => dbg(`usb device disconnected: ${JSON.stringify(e.target.getInfo())}`));
}

// ---------- picking the PNG ----------

drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") fileInput.click(); });
fileInput.addEventListener("change", () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); fileInput.value = ""; });
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("over");
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
// A file dropped anywhere else must not navigate away from the page.
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => e.preventDefault());

async function loadFile(file) {
  if (busy) return;
  pixels = null;
  sendBtn.disabled = true;
  dbg(`file: "${file.name}", type ${file.type || "?"}, ${file.size} bytes`);
  let img;
  try {
    // No colour-profile conversion: the screen gets the PNG's own pixel values.
    img = await createImageBitmap(file, { colorSpaceConversion: "none", premultiplyAlpha: "none" });
  } catch (e) {
    dbg(`decode failed: ${errText(e)}`);
    showRejected(file.name, "This isn't an image Chrome can open. Export it as a PNG.");
    return;
  }
  dbg(`image is ${img.width} x ${img.height}`);
  if (img.width !== W || img.height !== H) {
    const hint = (img.width === W * 2 && img.height === H * 2)
      ? "It looks like a 2x export. Export at 1x."
      : "Export the screen at exactly 320 × 240.";
    showRejected(file.name, `This image is ${img.width} × ${img.height}. ${hint}`);
    return;
  }
  const ctx = preview.getContext("2d");
  ctx.fillStyle = "#000";                 // transparent areas show as black on the screen too
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(img, 0, 0);
  pixels = toRgb565(ctx.getImageData(0, 0, W, H).data);
  dbg(`converted to RGB565, checksum ${fnv1a(pixels)}, first pixels ${hex(pixels.subarray(0, 8))}`);
  preview.style.display = "block";
  $("dropText").textContent = file.name;
  $("dropHint").textContent = "Drop another PNG to replace it";
  sendBtn.disabled = !("serial" in navigator);
  setStatus("Ready. Click Send to screen.");
}

function showRejected(name, why) {
  preview.style.display = "none";
  $("dropText").textContent = name;
  $("dropHint").textContent = "Drop a different PNG";
  setStatus(why, "bad");
}

// Short fingerprint of the pixels, so two reports can be checked for the same image.
function fnv1a(bytes) {
  let h = 0x811c9dc5;
  for (const b of bytes) h = Math.imul(h ^ b, 0x01000193) >>> 0;
  return h.toString(16).padStart(8, "0");
}

function toRgb565(rgba) {
  const out = new Uint8Array(W * H * 2);
  for (let i = 0, o = 0; i < rgba.length; i += 4, o += 2) {
    const v = ((rgba[i] >> 3) << 11) | ((rgba[i + 1] >> 2) << 5) | (rgba[i + 2] >> 3);
    out[o] = v >> 8;
    out[o + 1] = v & 0xff;
  }
  return out;
}

// ---------- serial link ----------

class ScreenError extends Error {
  constructor(message, details) { super(message); this.details = details; }
}

class Link {
  constructor(port) {
    this.port = port;
    this.buf = [];
    this.waiters = [];
  }
  async open() {
    dbg(`opening port ${JSON.stringify(this.port.getInfo())} at ${BAUD} baud`);
    await this.port.open({ baudRate: BAUD });
    dbg("port open");
    // Opening the port raises the adaptor's control lines, which resets the
    // screen; lowering them lets it start up again.
    try {
      await this.port.setSignals({ dataTerminalReady: false, requestToSend: false });
      this.signals = "lines low";
    } catch (e) {
      this.signals = `setSignals failed: ${errText(e)}`;
    }
    dbg(`control lines: ${this.signals}`);
    this.writer = this.port.writable.getWriter();
    this.reader = this.port.readable.getReader();
    this.pumping = this.pump();
  }
  async pump() {
    try {
      for (;;) {
        const { value, done } = await this.reader.read();
        if (done) break;
        dbg(`RX ${value.length} bytes: ${hex(value.subarray(0, 32))}${value.length > 32 ? " …" : ""}`);
        for (const b of value) this.buf.push(b);
        this.waiters.slice().forEach(w => w());
      }
    } catch (e) {
      dbg(`read stopped: ${errText(e)}`);
    }
  }
  write(bytes) {
    dbg(`TX ${bytes.length} bytes: ${hex(bytes.subarray(0, 10))}${bytes.length > 10 ? " …" : ""}`);
    return this.writer.write(bytes);
  }
  drain() { this.buf.length = 0; }
  read(n, ms) {
    return new Promise((resolve, reject) => {
      const check = () => {
        if (this.buf.length >= n) { done(); resolve(Uint8Array.from(this.buf.splice(0, n))); }
      };
      const timer = setTimeout(() => { done(); reject(new ScreenError("timeout")); }, ms);
      const done = () => { clearTimeout(timer); this.waiters = this.waiters.filter(w => w !== check); };
      this.waiters.push(check);
      check();
    });
  }
  async close() {
    dbg("closing port");
    try { await this.reader.cancel(); } catch {}
    try { this.reader.releaseLock(); } catch {}
    try { this.writer.releaseLock(); } catch {}
    try { await this.port.close(); } catch {}
  }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function pickPort() {
  const granted = await navigator.serial.getPorts();
  dbg(`allowed ports: ${granted.length ? granted.map(p => JSON.stringify(p.getInfo())).join(", ") : "none"}`);
  const known = granted.find(p => p.getInfo().usbVendorId === SILABS_VENDOR) || granted[0];
  if (known) return known;
  // First time only: Chrome asks which device to use.
  dbg("asking which device to use");
  try {
    const port = await navigator.serial.requestPort({ filters: [{ usbVendorId: SILABS_VENDOR }] });
    dbg(`chosen: ${JSON.stringify(port.getInfo())}`);
    return port;
  } catch (e) {
    dbg(`no device chosen: ${errText(e)}`);
    throw e;
  }
}

const hex = bytes => Array.from(bytes, b => b.toString(16).padStart(2, "0")).join(" ") || "nothing";

// Opening the port restarts the screen, which takes about 3 s (SPE manual,
// section 2.5). Anything sent before it is ready can leave its command reader
// out of step, so wait in silence first, then ask for its model name.
async function hello(link) {
  dbg(`waiting ${BOOT_MS} ms for the screen to start`);
  await sleep(BOOT_MS);
  let heard = [];
  for (let attempt = 0; attempt < 2; attempt++) {
    dbg(`asking for display model, attempt ${attempt + 1}`);
    heard = heard.concat(link.buf.splice(0));
    await link.write(new Uint8Array([0x00, 0x1a]));
    try {
      const head = await link.read(3, 1500);
      if (head[0] === 0x06) {
        const name = await link.read((head[1] << 8) | head[2], 1000);
        return new TextDecoder().decode(name);
      }
      heard = heard.concat(Array.from(head));
    } catch {}
    await sleep(1500);
  }
  heard = heard.concat(link.buf.splice(0));
  throw new ScreenError(
    heard.length
      ? "The screen answered in a way this page doesn't understand. Unplug its USB cable, plug it back in, wait 5 seconds, and try again."
      : "The screen didn't answer. Check its USB cable and try again. If it still doesn't answer, the screen may need its preview software loaded: click Copy troubleshooting report below and send it to Ariel.",
    `${link.signals}; received: ${hex(heard)}`);
}

async function expectAck(link, n, what) {
  let r;
  try { r = await link.read(n, 4000); }
  catch {
    throw new ScreenError("The screen stopped answering. Unplug its USB cable, plug it back in, wait 5 seconds, and try again.",
      `no reply to ${what}; pending: ${hex(link.buf)}`);
  }
  if (r[0] !== 0x06) {
    throw new ScreenError("The screen rejected the picture. Unplug its USB cable, plug it back in, wait 5 seconds, and try again.",
      `reply to ${what}: ${hex(r)}`);
  }
}

async function sendPicture(link, px) {
  await link.write(new Uint8Array([0xff, 0x42, 0x00, 0x00]));   // landscape
  await expectAck(link, 3, "screen mode");
  await link.write(new Uint8Array([0xff, 0x82]));               // clear screen
  await expectAck(link, 1, "clear");
  for (let y = 0; y < H; y += ROWS) {
    const n = Math.min(ROWS, H - y);
    const pkt = new Uint8Array(10 + W * n * 2);
    pkt.set([0x00, 0x23, 0, 0, y >> 8, y & 0xff, W >> 8, W & 0xff, n >> 8, n & 0xff]);
    pkt.set(px.subarray(y * W * 2, (y + n) * W * 2), 10);
    await link.write(pkt);
    await expectAck(link, 1, `row ${y}`);
    bar.value = y + n;
  }
}

sendBtn.addEventListener("click", async () => {
  if (!pixels || busy) return;
  busy = true;
  sendBtn.disabled = true;
  bar.value = 0;
  bar.style.display = "block";
  $("details").textContent = "";
  let link = null;
  try {
    let port;
    try { port = await pickPort(); }
    catch { throw new ScreenError("No screen selected. If the list was empty, check the screen's USB cable and try again."); }
    link = new Link(port);
    setStatus("Connecting to the screen…");
    try { await link.open(); }
    catch (e) {
      dbg(`open failed: ${errText(e)}`);
      link = null;
      throw new ScreenError("Couldn't open the screen's connection. Close any other program using it (such as Workshop4), then try again.", errText(e));
    }
    setStatus("Waiting for the screen to start…");
    const model = await hello(link);
    setStatus(`Sending to ${model}…`);
    const t0 = performance.now();
    await sendPicture(link, pixels);
    dbg(`picture sent in ${((performance.now() - t0) / 1000).toFixed(1)} s, checksum ${fnv1a(pixels)}`);
    setStatus(`Done. The screen is showing your design (${((performance.now() - t0) / 1000).toFixed(0)} s).`, "ok");
  } catch (e) {
    dbg(`failed: ${errText(e)}${e.details ? ` (${e.details})` : ""}`);
    setStatus(e instanceof ScreenError ? e.message : `Something went wrong: ${e.message}`, "bad");
    $("details").textContent = e.details ? `Details for your engineer: ${e.details}` : "";
  } finally {
    if (link) await link.close();
    busy = false;
    sendBtn.disabled = !pixels;
  }
});
</script>
</body>
</html>
